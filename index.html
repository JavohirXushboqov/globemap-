<style>
:root{--bg:#f4f6f9;--fg:#101828;--mut:#667085;--card:#fff;--glass:rgba(255,255,255,.72);--line:#e4e7ec;--acc:#d97706;--sea:#dbe7f5;--land:#c9d3e0;--bd:#fff;--pt:#475467}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f17;--fg:#eef2f8;--mut:#98a2b3;--card:#141a26;--glass:rgba(16,22,34,.66);--line:#243044;--acc:#fbbf24;--sea:#111b2c;--land:#2a3850;--bd:#0b0f17;--pt:#98a2b3}}
:root[data-theme=dark]{--bg:#0b0f17;--fg:#eef2f8;--mut:#98a2b3;--card:#141a26;--glass:rgba(16,22,34,.66);--line:#243044;--acc:#fbbf24;--sea:#111b2c;--land:#2a3850;--bd:#0b0f17;--pt:#98a2b3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:5;padding:12px 12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:720px;margin:0 auto}
.logo{flex:0 0 100%;text-align:center;font-weight:800;letter-spacing:.32em;padding-left:.32em;font-size:clamp(28px,8vw,48px);line-height:1.1}
.sw{position:relative;flex:1}
input,select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--fg);padding:0 12px;font:inherit}
.btn{height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--fg);font:inherit;cursor:pointer}
.btn.on{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--fg);border-color:var(--acc)}.btn:hover{border-color:var(--acc)}.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass);backdrop-filter:blur(16px)}.seg button{border:0;background:none;color:var(--mut);height:42px;width:38px;font:700 12px inherit;cursor:pointer;transition:all .25s}.seg .on{background:color-mix(in srgb,var(--acc) 28%,transparent);color:var(--fg)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}#sInfo.open>*{animation:rise .55s cubic-bezier(.2,.9,.25,1) both}#sInfo.open>:nth-child(2){animation-delay:.06s}#sInfo.open>:nth-child(3){animation-delay:.12s}#sInfo.open>:nth-child(4){animation-delay:.18s}#dd div{animation:rise .3s both}#dd div:nth-child(2){animation-delay:.04s}#dd div:nth-child(3){animation-delay:.08s}
#dd{position:absolute;top:50px;left:0;right:0;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow:auto;display:none;box-shadow:0 12px 30px #0003}
#dd div{padding:11px 12px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid var(--line)}
#dd small{color:var(--mut);margin-left:auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tagline{position:absolute;top:calc(env(safe-area-inset-top) + 122px);width:100%;text-align:center;color:var(--mut);font-size:12px;letter-spacing:.06em;pointer-events:none}
nav{position:absolute;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:58px;border:0;background:none;color:var(--mut);font:12px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button.on{color:var(--acc)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.sheet{position:absolute;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:4;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:16px;max-height:62vh;overflow:auto;transform:translateY(110%);transition:transform .5s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
.k{color:var(--mut);font-size:12px}.v{font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big{font-size:26px;font-weight:700}
.note{font-size:11px;color:var(--mut);margin-top:8px}
#modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex;animation:fade .25s}#modal.open #mc{animation:pop .35s cubic-bezier(.2,.9,.25,1)}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}}@keyframes fade{from{opacity:0;transform:translateY(-8px)}}#dd{animation:fade .2s}.btn,nav button{transition:all .2s}.btn:active{transform:scale(.96)}
#mc{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px;border-top:4px solid var(--acc)}
footer{position:absolute;left:0;right:0;text-align:center;bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;font-size:10px;color:var(--mut);pointer-events:none;}footer b{display:block;font-size:15px;letter-spacing:.5em;padding-left:.5em;color:var(--fg);font-weight:800}footer span{letter-spacing:.2em;text-transform:uppercase}#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;animation:out .9s 1.7s forwards}#splash b{font-size:clamp(32px,10vw,64px);letter-spacing:.32em;padding-left:.32em;font-weight:800}#splash i{font-style:normal;color:var(--mut);font-size:12px;letter-spacing:.08em}#splash span{margin-top:30px;font-size:18px;letter-spacing:.6em;padding-left:.6em;color:var(--acc);font-weight:800}#splash>*{animation:fade 1s both}@keyframes out{to{opacity:0;visibility:hidden}}
.err{color:#d92d20;font-size:13px;margin-top:6px}
.logo{color:#fff;text-shadow:0 2px 24px #000}.tagline,footer{color:#b9c6dc}footer b{color:#fff}html,body{background:#000004}
#lab{position:absolute;z-index:3;pointer-events:none;display:none;transform:translate(-50%,-100%);margin-top:-14px;padding:5px 10px;border-radius:10px;background:rgba(10,16,28,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:13px;white-space:nowrap;text-align:center;border:1px solid #fff3}#lab i{display:block;font-style:normal;font-size:10px;color:#fbbf24}#lab:after{content:"";position:absolute;left:50%;bottom:-11px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fbbf24;box-shadow:0 0 10px 3px #fbbf24aa}
</style></head><body>
